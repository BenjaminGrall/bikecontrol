name: APK Android

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests et APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk click2whoosh.apk

      - uses: actions/upload-artifact@v4
        with:
          name: click2whoosh-apk
          path: android/click2whoosh.apk

      # Sur la branche par défaut, l'APK est aussi publié dans une release « derniere-version »,
      # téléchargeable directement depuis le téléphone (onglet Releases du dépôt).
      - name: Publier la dernière version
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete derniere-version --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create derniere-version click2whoosh.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "click2whoosh (dernière version)" \
            --notes "APK construit automatiquement depuis le commit $GITHUB_SHA."
